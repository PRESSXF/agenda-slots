name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos e build (biblioteca e site)
        run: npm run build
      - name: Testes com cobertura
        run: npm run test:coverage
      - name: Conteúdo do pacote e importação ESM/CJS
        run: npm run check:package
